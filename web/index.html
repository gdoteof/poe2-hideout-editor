<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoE2 Hideout Editor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr;
        font: 13px/1.5 system-ui, sans-serif; background: #14161a; color: #d8dde4;
      }
      aside {
        padding: 16px; border-right: 1px solid #262a31; overflow-y: auto;
        display: flex; flex-direction: column; gap: 14px;
      }
      h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .3px; }
      .muted { color: #7d8794; }
      button, label.file {
        display: inline-block; background: #2a2f38; color: #e6ebf2; border: 1px solid #39404b;
        padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
      }
      button:hover, label.file:hover { background: #333a45; }
      button:disabled { opacity: .4; cursor: default; }
      input[type=file] { display: none; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      dt { color: #7d8794; } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      canvas { width: 100%; height: 100%; display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
      main { position: relative; overflow: hidden; }
      #tip {
        position: absolute; pointer-events: none; background: #000c; padding: 3px 7px;
        border-radius: 4px; font-size: 12px; transform: translate(10px, 10px); display: none;
        white-space: nowrap;
      }
      .hint { font-size: 12px; color: #7d8794; }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <h1>PoE2 Hideout Editor</h1>
        <div class="muted">lossless viewer · v0</div>
      </div>
      <label class="file">Open .hideout<input id="file" type="file" accept=".hideout" /></label>
      <dl id="stats">
        <dt>Base</dt><dd id="s-base">—</dd>
        <dt>hideout_hash</dt><dd id="s-hash">—</dd>
        <dt>Doodads</dt><dd id="s-count">—</dd>
        <dt>Unique</dt><dd id="s-unique">—</dd>
        <dt>Grid X</dt><dd id="s-x">—</dd>
        <dt>Grid Y</dt><dd id="s-y">—</dd>
      </dl>
      <button id="export" disabled>Export .hideout</button>
      <div class="hint">Scroll to zoom · drag to pan · hover a dot for its name. Export re-writes the file byte-for-byte.</div>

      <hr style="border:none;border-top:1px solid #262a31;width:100%;margin:2px 0" />
      <div>
        <h1 style="font-size:14px">Image → Mosaic</h1>
        <div class="muted" style="margin-bottom:8px">Turn a picture into a decoration layout.</div>
        <img id="src-preview" src="./assets/dickbutt.jpg" alt="source"
             style="width:100%;border-radius:6px;border:1px solid #39404b;background:#fff" />
        <label class="file" style="margin-top:8px">Replace image<input id="img-file" type="file" accept="image/*" /></label>
      </div>
      <label>Mode
        <select id="m-mode" style="width:100%;margin-top:3px;background:#2a2f38;color:#e6ebf2;border:1px solid #39404b;border-radius:6px;padding:6px">
          <option value="ink" selected>Ink (line art)</option>
          <option value="color">Color</option>
        </select>
      </label>
      <label>Resolution: <span id="m-cols-v">90</span> cols
        <input id="m-cols" type="range" min="30" max="160" value="90" style="width:100%" />
      </label>
      <label id="m-ink-row">Line sensitivity: <span id="m-ink-v">130</span>
        <input id="m-ink" type="range" min="60" max="200" value="130" style="width:100%" />
      </label>
      <button id="generate">Generate mosaic</button>
      <div class="hint" id="m-info">—</div>
    </aside>
    <main>
      <canvas id="cv"></canvas>
      <div id="tip"></div>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
